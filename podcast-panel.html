<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小宇宙阅读与批注</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <link rel="stylesheet" href="podcast-panel.css" />
</head>
<body>
  <header class="header podcast-header">
    <div class="header-top">
      <div class="video-info"><div class="video-title" id="podcastTitle">小宇宙阅读</div><div class="video-channel" id="podcastChannel"></div></div>
      <button class="settings-btn" id="settingsBtn" type="button">设置</button>
    </div>
    <div class="podcast-toolbar">
      <button class="enhance-btn" id="reloadBtn" type="button">读取素材库</button>
      <label class="enhance-btn import-label">导入全文<input id="importFile" type="file" accept=".md,.txt,.srt,.vtt,.json" /></label>
      <button class="enhance-btn" id="archiveBtn" type="button" disabled>保存到 Obsidian</button>
      <button class="enhance-btn" id="exportBtn" type="button" disabled>导出 Markdown</button>
    </div>
    <p class="podcast-status" id="status" role="status" aria-live="polite">正在识别当前节目…</p>
    <div class="tabs">
      <button class="tab active" data-view="transcript" type="button">全文</button>
      <button class="tab" data-view="overview" type="button">概览</button>
      <button class="tab" data-view="annotations" type="button">我的批注 <span id="annotationCount">0</span></button>
    </div>
  </header>
  <main class="content" id="podcastContent">
    <section data-podcast-view="transcript">
      <div class="reading-toolbar">
        <label>显示 <select id="readMode" aria-label="原稿或阅读版"><option value="reading">精校阅读版</option><option value="source">原始转写</option></select></label>
        <label><select id="refineScope" aria-label="精校范围"><option value="preview">开头试读</option><option value="all">继续精校全文</option></select></label>
        <button class="enhance-btn" id="refineBtn" type="button" disabled>生成阅读版</button>
        <button class="enhance-btn" id="stopRefineBtn" type="button" hidden>本批完成后停止</button>
      </div>
      <p id="readingStatus" class="podcast-status" aria-live="polite"></p>
      <details class="audio-settings"><summary>疑难段落听音复核</summary><p>需设置 OpenRouter，使用已配置的 API Key。点击段落旁的“听音复核”会先用本地 Whisper 转写，再把最多 90 秒音频交给云端模型，按服务价格计费。音频须已保存为该集本地 source.mp3。</p><label>音频模型 <select id="audioModel"><option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option><option value="google/gemini-3.1-flash-lite-preview">Gemini 3.1 Flash Lite Preview</option></select></label></details>
      <p id="emptyState" class="podcast-empty">打开小宇宙单集页后，可读取素材库中的全文，或导入 Markdown、TXT、SRT、VTT、JSON 文稿。节目简介不会作为全文。</p>
      <div class="podcast-search"><input id="searchInput" type="search" placeholder="搜索全文" aria-label="搜索全文" /><output id="searchCount" aria-live="polite"></output></div>
      <div id="transcriptList"></div>
    </section>
    <section data-podcast-view="overview" hidden>
      <p class="podcast-empty">概览由 AI 根据全文生成，可能有误；引用请核对原文。生成时使用设置中选择的 AI 服务。</p>
      <button class="enhance-btn" id="analyzeBtn" type="button" disabled>生成概览</button>
      <div id="overview"></div>
    </section>
    <section data-podcast-view="annotations" hidden><div id="annotationsList"></div></section>
  </main>
  <aside id="annotationEditor" class="podcast-editor" hidden aria-label="原句批注">
    <div class="section-header"><strong>写下感想</strong><button class="enhance-btn" id="cancelAnnotationBtn" type="button">取消</button></div>
    <blockquote id="selectedQuote"></blockquote>
    <textarea id="thoughtInput" rows="4" placeholder="我想到的是…" aria-label="我的感想"></textarea>
    <div class="podcast-editor-actions"><button class="enhance-btn" id="explainBtn" type="button">解释原句</button><button class="enhance-btn primary" id="saveAnnotationBtn" type="button">保存批注草稿</button></div>
    <p id="editorStatus" role="status"></p>
    <div id="explanation" hidden><strong>AI 解释</strong><p id="explanationText"></p></div>
  </aside>
  <script src="media-platform.js"></script>
  <script src="podcast-core.js"></script>
  <script src="podcast-reading.js"></script>
  <script src="podcast-panel.js"></script>
</body>
</html>
